<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
    <defs>
        <linearGradient id="siaIconPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5"/>
            <stop offset="50%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>

        <linearGradient id="siaIconCyan" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#06b6d4"/>
            <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>

        <linearGradient id="siaIconGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#fbbf24"/>
        </linearGradient>

        <linearGradient id="siaIconDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0b0f19"/>
            <stop offset="50%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#1e1b4b"/>
        </linearGradient>

        <filter id="siaIconGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <filter id="siaIconShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#4f46e5" flood-opacity="0.35"/>
        </filter>
    </defs>

    <!-- Fondo de cristal pulido -->
    <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#siaIconDarkBg)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

    <!-- Cubo Isométrico Smart Almacén -->
    <g transform="translate(14, 12)" filter="url(#siaIconShadow)">
        <!-- Cara Superior (Cian Luminoso) -->
        <polygon points="50,18 82,36 50,54 18,36" fill="url(#siaIconCyan)" opacity="0.95"/>
        
        <!-- Cara Izquierda (Índigo Profundo) -->
        <polygon points="18,36 50,54 50,88 18,70" fill="#312e81" opacity="0.9"/>
        
        <!-- Cara Derecha (Azul Gradiente) -->
        <polygon points="50,54 82,36 82,70 50,88" fill="url(#siaIconPrimary)" opacity="0.92"/>

        <!-- Borde Iluminado Superior -->
        <polyline points="18,36 50,18 82,36" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none"/>

        <!-- Núcleo Dorado: Escudo Social / Respaldo -->
        <path d="M50 40 L62 47 V59 C62 68 50 75 50 75 C50 75 38 68 38 59 V47 Z" fill="url(#siaIconGold)" opacity="0.96" filter="url(#siaIconGlow)"/>

        <!-- Ondas de Logística y Entrega Dinámica -->
        <path d="M14,80 C32,70 68,90 86,80" stroke="url(#siaIconCyan)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M22,90 C38,80 62,98 78,90" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
    </g>
</svg>
