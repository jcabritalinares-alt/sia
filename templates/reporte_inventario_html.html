<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        
        /* Encabezado Profesional */
        .report-header { width: 100%; padding-bottom: 20px; border-bottom: 2px solid #000; }
        .logo-img { width: 70px; }
        .title-cell { text-align: center; }
        
        /* Estilos de Tabla */
        th { background-color: #e9ecef; border: 1px solid #000; padding: 8px; text-align: left; }
        td { border: 1px solid #ccc; padding: 6px; }
        
        /* Alternar colores en filas para mejor lectura */
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>

<table>
    <thead>
        <tr>
            <td colspan="4">
                <div class="report-header">
                    <table style="width: 100%;">
                        <tr>
                            <td style="width: 15%;"><img src="https://res.cloudinary.com/tehn5bfb/image/upload/v1783630731/efad9adhn201uv8xemcn.jpg" class="logo-img"></td>
                            <td class="title-cell">
                                <h1 style="margin: 0; font-size: 18px;">Valera Panical</h1>
                                <h2 style="margin: 0; font-size: 14px;">Reporte de Inventario</h2>
                                <small>Fecha: 14/07/2026</small>
                            </td>
                            <td style="width: 15%; text-align: right;"><img src="https://res.cloudinary.com/tehn5bfb/image/upload/v1783630731/hgb44vfc0d8wirbnz2th.jpg" class="logo-img"></td>
                        </tr>
                    </table>
                </div>
            </td>
        </tr>
        <tr>
            <th style="width: 10%;">Código</th>
            <th style="width: 50%;">Descripción</th>
            <th style="width: 25%;">Almacén</th>
            <th style="width: 15%;">Cantidad</th>
        </tr>
    </thead>
    <tbody>
        {% for p in productos|dictsort:"codigo" %} <tr>
            <td>{{ p.codigo }}</td>
            <td>{{ p.descripcion }}</td>
            <td>{{ p.almacen }}</td>
            <td>{{ p.cantidad }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
