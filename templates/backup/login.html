{% extends 'base.html' %}
{% block contenido %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger text-center">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <div class="card shadow">
                <div class="card-body">
                    <h3 class="text-center">Iniciar Sesión</h3>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label>Usuario</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Contraseña</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    // Si estás en la página de login, este script se ejecutará.
    // Si quisieras que el mensaje saliera en el DASHBOARD, 
    // mueve este script al archivo 'dashboard.html'
    
    document.addEventListener("DOMContentLoaded", function() {
        // Buscamos si existe un mensaje de éxito enviado desde la vista
        {% if messages %}
            {% for message in messages %}
                {% if "bienvenida" in message.tags %}
                    Swal.fire({
                        title: '¡Bienvenido al Sistema!',
                        text: '{{ message }}',
                        icon: 'success',
                        timer: 3000,
                        showConfirmButton: false,
                        didOpen: () => {
                            Swal.showLoading(); // Efecto de carga inicial
                        }
                    });
                {% endif %}
            {% endfor %}
        {% endif %}
    });
</script>
{% endblock %}
