<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas de Almacén - {{ producto.descripcion }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .no-print { display: block; }

        .sticker-card {
            width: 70mm;
            height: 42mm;
            border: 2px dashed #000;
            background: #fff;
            padding: 3mm;
            border-radius: 6px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            page-break-inside: avoid;
            margin-bottom: 5mm;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .sticker-header {
            font-size: 8pt;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #1e293b;
            border-bottom: 1.5px solid #000;
            padding-bottom: 1.5mm;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sticker-body {
            display: flex;
            align-items: center;
            gap: 2.5mm;
            flex-grow: 1;
            padding-top: 1mm;
        }

        .sticker-qr {
            width: 22mm;
            height: 22mm;
            object-fit: contain;
        }

        .sticker-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .sticker-title {
            font-size: 9.5pt;
            font-weight: 700;
            line-height: 1.1;
            color: #0f172a;
            max-height: 2.2em;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sticker-code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 8.5pt;
            font-weight: 800;
            background: #f1f5f9;
            padding: 1px 4px;
            border-radius: 3px;
            display: inline-block;
            margin-top: 2px;
            border: 1px solid #cbd5e1;
        }

        .sticker-footer {
            font-size: 7.5pt;
            font-weight: 600;
            color: #475569;
            border-top: 1px solid #e2e8f0;
            padding-top: 1mm;
            display: flex;
            justify-content: space-between;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: #fff !important; padding: 0 !important; }
            .container { max-width: 100% !important; width: 100% !important; padding: 0 !important; }
            .sticker-card {
                border: 1px solid #000 !important;
                box-shadow: none !important;
                margin-bottom: 3mm !important;
            }
        }
    </style>
</head>
<body class="p-3 p-md-4">

    <!-- Panel de Control Superior (Solo Pantalla) -->
    <div class="container no-print mb-4">
        <div class="card shadow-sm border-0 rounded-4 p-3 bg-white">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <h5 class="fw-bold mb-1 text-dark d-flex align-items-center gap-2">
                        <i class="bi bi-tag-fill text-primary"></i> Impresión de Etiquetas de Almacén
                    </h5>
                    <p class="text-muted small mb-0">Producto: <strong>{{ producto.descripcion }}</strong> (Código: {{ codigo_prod }})</p>
                </div>
                <div class="d-flex flex-wrap align-items-center gap-3">
                    <div class="d-flex align-items-center gap-2">
                        <label class="fw-semibold small text-secondary">Cantidad de Etiquetas:</label>
                        <input type="number" id="inputCopias" class="form-control form-control-sm text-center fw-bold" value="8" min="1" max="50" style="width: 75px;" onchange="generarGrillaEtiquetas()">
                    </div>
                    <button onclick="window.print()" class="btn btn-primary fw-bold px-4 rounded-3 shadow-sm d-flex align-items-center gap-2">
                        <i class="bi bi-printer-fill"></i> Imprimir Etiquetas
                    </button>
                    <button onclick="window.close()" class="btn btn-outline-secondary btn-sm">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Grilla de Etiquetas Imprimibles -->
    <div class="container">
        <div id="gridEtiquetas" class="d-flex flex-wrap gap-3 justify-content-center">
            <!-- Se generará dinámicamente con JS según el número de copias -->
        </div>
    </div>

    <script>
        const qrUrl = "{{ qr_url|default:'' }}";
        const qrImgSrc = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(qrUrl)}`;
        const prodNombre = "{{ producto.descripcion|escapejs }}";
        const prodCodigo = "{{ codigo_prod }}";
        const prodCategoria = "{{ producto.categoria|default:'ALMACÉN CENTRAL'|escapejs }}";

        function generarGrillaEtiquetas() {
            const num = parseInt(document.getElementById('inputCopias').value) || 1;
            const container = document.getElementById('gridEtiquetas');
            container.innerHTML = '';

            for (let i = 0; i < num; i++) {
                const card = document.createElement('div');
                card.className = 'sticker-card';
                card.innerHTML = `
                    <div class="sticker-header">
                        <span>🏛️ SIA ALMACÉN</span>
                        <span>CÓD: ${prodCodigo}</span>
                    </div>
                    <div class="sticker-body">
                        <img src="${qrImgSrc}" class="sticker-qr bg-white p-0.5 border rounded-1" alt="QR Code">
                        <div class="sticker-info">
                            <div class="sticker-title">${prodNombre}</div>
                            <div class="sticker-code">${prodCodigo}</div>
                        </div>
                    </div>
                    <div class="sticker-footer">
                        <span>Cat: ${prodCategoria}</span>
                        <span>Inventario Social</span>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        // Generar etiquetas iniciales
        generarGrillaEtiquetas();
    </script>
</body>
</html>
